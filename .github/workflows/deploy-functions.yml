
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is missing."
            exit 1
          fi

          supabase functions deploy create-draw --project-ref "$PROJECT_REF"
          supabase functions deploy execute-draw --project-ref "$PROJECT_REF"
          supabase functions deploy verify-draw --project-ref "$PROJECT_REF"
          supabase functions deploy register-event --project-ref "$PROJECT_REF"
          supabase functions deploy join-room --project-ref "$PROJECT_REF"
