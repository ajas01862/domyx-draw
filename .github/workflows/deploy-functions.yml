
name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy create-draw --project-ref "$PROJECT_REF"
          supabase functions deploy execute-draw --project-ref "$PROJECT_REF"
          supabase functions deploy verify-draw --project-ref "$PROJECT_REF"
          supabase functions deploy register-event --project-ref "$PROJECT_REF"
          supabase functions deploy join-room --project-ref "$PROJECT_REF"
